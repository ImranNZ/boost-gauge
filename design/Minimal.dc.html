<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C · Digital Minimal boost gauge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Barlow:wght@400;500;600&display=swap">
<style>
body{margin:0}
button{font-family:'Barlow',system-ui,sans-serif}
</style>
</helmet>
<div style="width: 520px; height: 680px; box-sizing: border-box; padding: 28px 32px; background: #14171b; color: #f2efe9; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.01em">C · Digital Minimal</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #a3aab2">No needle. A thin glowing arc grows out from zero: blue for vacuum, a green-to-red heat ramp for boost. The number is the hero.</p>
  </div>

  <div style="height: 400px; display: flex; align-items: center; justify-content: center">
    <div style="position: relative; width: {{gaugePx}}px; height: {{gaugePx}}px">
    <svg viewBox="0 0 240 240" role="img" aria-label="Boost gauge, minimal digital arc" style="width: 100%; height: 100%; display: block">
      <defs>
        <radialGradient id="bgC" cx="0.5" cy="0.45" r="0.6">
          <stop offset="0" stop-color="#0d1115"/>
          <stop offset="1" stop-color="#05070a"/>
        </radialGradient>
        <filter id="glowC" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="4.5"/>
        </filter>
      </defs>

      <circle cx="120" cy="120" r="120" fill="url(#bgC)"/>
      <circle cx="120" cy="120" r="118.6" fill="none" stroke="#161b21" stroke-width="1.6"/>

      <circle cx="120" cy="120" r="100" fill="none" stroke="#1b2128" stroke-width="10" stroke-linecap="round" stroke-dasharray="471.24 700" transform="rotate(135 120 120)"/>

      <g opacity="{{arcOpacity}}">
        <circle cx="120" cy="120" r="100" fill="none" stroke="{{arcColor}}" stroke-width="10" stroke-linecap="round" stroke-dasharray="{{arcDash}}" transform="{{arcRotate}}" opacity="0.55" filter="url(#glowC)"/>
        <circle cx="120" cy="120" r="100" fill="none" stroke="{{arcColor}}" stroke-width="10" stroke-linecap="round" stroke-dasharray="{{arcDash}}" transform="{{arcRotate}}"/>
      </g>

      <path d="M58.89 28.54L70 45.17" fill="none" stroke="#e7eaee" stroke-width="1.6" opacity="0.85"/>

      <circle cx="{{peakX}}" cy="{{peakY}}" r="3.6" fill="#ffffff" stroke="#05070a" stroke-width="1.4" opacity="{{peakOpacity}}"/>

      <g font-family="'Outfit', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#8a939d">
        <text x="62" y="178">-15</text>
        <text x="74.4" y="51.8">0</text>
        <text x="165.6" y="51.8">10</text>
        <text x="200.4" y="136">20</text>
        <text x="178" y="178">25</text>
      </g>

      <text x="120" y="82" font-family="'Outfit', sans-serif" font-size="11" font-weight="500" letter-spacing="4.2" text-anchor="middle" fill="{{arcColor}}">{{modeLabel}}</text>
      <text x="120" y="120" font-family="'Outfit', sans-serif" font-size="62" font-weight="300" text-anchor="middle" dominant-baseline="central" fill="#ffffff">{{readout}}</text>
      <text x="120" y="158" font-family="'Outfit', sans-serif" font-size="12" font-weight="500" letter-spacing="4.4" text-anchor="middle" fill="#8a939d">PSI</text>
      <text x="120" y="182" font-family="'Outfit', sans-serif" font-size="12" font-weight="500" letter-spacing="2" text-anchor="middle" fill="#cfd5db">{{peakText}}</text>
    </svg>
    <img src="/_blob/a3bf5e3c0e2ef1b85a51c1db5437641e" alt="Cooper S" style="position: absolute; left: 36.67%; top: 22.46%; width: 26.67%; height: auto; display: block; pointer-events: none">
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 10px; flex-wrap: wrap">
      <button type="button" onClick="{{onDrive}}" aria-pressed="{{driveOn}}" style="min-height: 44px; padding: 0 18px; border-radius: 10px; background: transparent; color: #f2efe9; font-size: 14px; cursor: pointer; border: 1px solid {{driveBorder}}">Drive cycle</button>
      <button type="button" onClick="{{onReal}}" aria-pressed="{{realOn}}" style="min-height: 44px; padding: 0 18px; border-radius: 10px; background: transparent; color: #f2efe9; font-size: 14px; cursor: pointer; border: 1px solid {{realBorder}}">Real size</button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <label for="boostC" style="font-size: 14px; color: #a3aab2; white-space: nowrap">Hold boost</label>
      <input id="boostC" type="range" min="-15" max="25" step="0.5" value="{{sliderVal}}" onChange="{{onSlide}}" style="flex: 1 1 auto; min-width: 0; accent-color: #2fe0b0">
      <span style="min-width: 64px; text-align: right; font-size: 14px; font-variant-numeric: tabular-nums; color: #f2efe9">{{sliderLabel}}</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":680}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.t0 = performance.now();
    this.setState({ mode: 'drive', held: 0, shown: -11, peak: 0, peakAt: 0, real: false });
    this.timer = setInterval(() => this.tick(), 33);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  profile(ms) {
    const k = [[0, -11], [3, -11], [5, 17], [8, 17.5], [10, -12], [14, -5], [17, 6], [20, -11]];
    const t = (ms % 20000) / 1000;
    for (let i = 1; i < k.length; i++) {
      if (t <= k[i][0]) {
        const f = (t - k[i - 1][0]) / (k[i][0] - k[i - 1][0]);
        return k[i - 1][1] + (k[i][1] - k[i - 1][1]) * f * f * (3 - 2 * f);
      }
    }
    return k[k.length - 1][1];
  }
  tick() {
    const s = this.state || {};
    const now = performance.now();
    const target = (s.mode ?? 'drive') === 'drive' ? this.profile(now - this.t0) : (s.held ?? 0);
    const from = s.shown ?? target;
    const shown = from + (target - from) * (1 - Math.exp(-33 / 80));
    let peak = s.peak ?? shown;
    let peakAt = s.peakAt ?? now;
    if (shown >= peak || now - peakAt > 5000) { peak = shown; peakAt = now; }
    this.setState({ shown, peak, peakAt });
  }
  colorFor(psi) {
    if (psi < 0) return '#4aa3ff';
    const stops = [[0, [47, 224, 176]], [12, [155, 224, 74]], [17, [255, 176, 32]], [21, [255, 77, 77]]];
    if (psi >= stops[3][0]) return 'rgb(' + stops[3][1].join(',') + ')';
    for (let i = 1; i < stops.length; i++) {
      if (psi <= stops[i][0]) {
        const f = (psi - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]);
        const a = stops[i - 1][1];
        const b = stops[i][1];
        return 'rgb(' + a.map((v, j) => Math.round(v + (b[j] - v) * f)).join(',') + ')';
      }
    }
    return '#2fe0b0';
  }
  renderVals() {
    const s = this.state || {};
    const shown = s.shown ?? -11;
    const peak = s.peak ?? 0;
    const mode = s.mode ?? 'drive';
    const real = !!s.real;
    const held = s.held ?? 0;
    const ang = (p) => 135 + (Math.min(25, Math.max(-15, p)) + 15) * 6.75;
    const boost = shown >= 0;
    const length = Math.min(Math.abs(shown), boost ? 25 : 15) * 11.781;
    const startAngle = boost ? 236.25 : ang(shown);
    const peakRad = ang(peak) * Math.PI / 180;
    const accent = this.colorFor(shown);
    return {
      arcColor: accent,
      arcDash: length.toFixed(2) + ' 700',
      arcRotate: 'rotate(' + startAngle.toFixed(2) + ' 120 120)',
      arcOpacity: length > 0.4 ? 1 : 0,
      peakX: (120 + Math.cos(peakRad) * 100).toFixed(2),
      peakY: (120 + Math.sin(peakRad) * 100).toFixed(2),
      peakOpacity: peak > 0.05 ? 1 : 0,
      peakText: peak > 0.05 ? 'PEAK ' + peak.toFixed(1) : '',
      modeLabel: boost ? 'BOOST' : 'VACUUM',
      readout: shown.toFixed(1),
      gaugePx: real ? 123 : 380,
      sliderVal: mode === 'hold' ? held : Math.round(shown * 2) / 2,
      sliderLabel: (mode === 'hold' ? held : shown).toFixed(1) + ' psi',
      driveOn: mode === 'drive',
      realOn: real,
      driveBorder: mode === 'drive' ? '#2fe0b0' : '#39404a',
      realBorder: real ? '#2fe0b0' : '#39404a',
      onDrive: () => this.setState({ mode: 'drive' }),
      onSlide: (e) => this.setState({ mode: 'hold', held: parseFloat(e.target.value) }),
      onReal: () => this.setState({ real: !(this.state && this.state.real) })
    };
  }
}
</script>
</body>
</html>
