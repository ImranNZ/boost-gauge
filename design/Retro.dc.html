<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B · Retro 60s Cooper boost gauge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Barlow:wght@400;500;600&display=swap">
<style>
body{margin:0}
button{font-family:'Barlow',system-ui,sans-serif}
</style>
</helmet>
<div style="width: 520px; height: 680px; box-sizing: border-box; padding: 28px 32px; background: #14171b; color: #f2efe9; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.01em">B · Retro 60s Cooper</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #a3aab2">A cream dial, fine black graduations and a slim red needle with a counterweight tail. Purely analog; the peak shows as a small flag on the scale.</p>
  </div>

  <div style="height: 400px; display: flex; align-items: center; justify-content: center">
    <div style="position: relative; width: {{gaugePx}}px; height: {{gaugePx}}px">
    <svg viewBox="0 0 240 240" role="img" aria-label="Boost gauge, retro cream dial" style="width: 100%; height: 100%; display: block">
      <defs>
        <linearGradient id="chromeB1" x1="0.1" y1="0" x2="0.9" y2="1">
          <stop offset="0" stop-color="#fbfcfd"/>
          <stop offset="0.22" stop-color="#aab1ba"/>
          <stop offset="0.48" stop-color="#5a6068"/>
          <stop offset="0.72" stop-color="#cfd4da"/>
          <stop offset="1" stop-color="#7d838b"/>
        </linearGradient>
        <linearGradient id="chromeB2" x1="0.9" y1="1" x2="0.1" y2="0">
          <stop offset="0" stop-color="#e9ecef"/>
          <stop offset="0.5" stop-color="#4b5058"/>
          <stop offset="1" stop-color="#bfc5cb"/>
        </linearGradient>
        <radialGradient id="creamB" cx="0.42" cy="0.36" r="0.8">
          <stop offset="0" stop-color="#f6eedb"/>
          <stop offset="0.7" stop-color="#ebe0c5"/>
          <stop offset="1" stop-color="#d9ccac"/>
        </radialGradient>
        <radialGradient id="ageB" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0.8" stop-color="#5a4a2a" stop-opacity="0"/>
          <stop offset="1" stop-color="#5a4a2a" stop-opacity="0.28"/>
        </radialGradient>
        <linearGradient id="glassB" x1="0.2" y1="0" x2="0.6" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="0.34"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <filter id="shadowB" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="1" dy="2" stdDeviation="1.2" flood-color="#2a2013" flood-opacity="0.55"/>
        </filter>
      </defs>

      <circle cx="120" cy="120" r="119.5" fill="#050506"/>
      <circle cx="120" cy="120" r="113.5" fill="none" stroke="url(#chromeB1)" stroke-width="12"/>
      <circle cx="120" cy="120" r="107.4" fill="none" stroke="url(#chromeB2)" stroke-width="1.6"/>
      <circle cx="120" cy="120" r="106.5" fill="url(#creamB)"/>
      <circle cx="120" cy="120" r="106.5" fill="url(#ageB)"/>

      <path d="M221.02 140.09A103 103 0 0 1 192.83 192.83" fill="none" stroke="#c0261c" stroke-width="4.6"/>

      <path d="M21.92 139.51L36.63 136.58M27.61 81.73L41.47 87.47M64.44 36.85L72.78 49.33M120 20L120 35M175.56 36.85L167.22 49.33M212.39 81.73L198.53 87.47M218.08 139.51L203.37 136.58M49.29 190.71L59.9 180.1M190.71 190.71L180.1 180.1" fill="none" stroke="#1c1a16" stroke-width="2.2"/>
      <path d="M41.47 181.91L45.39 178.81M34.74 172.25L39 169.64M29.19 161.87L33.73 159.77M24.89 150.9L29.65 149.36M20.31 127.85L25.29 127.45M20.08 116.07L25.07 116.27M21.23 104.36L26.17 105.14M23.75 92.86L28.57 94.21M32.75 71.14L37.11 73.58M39.1 61.22L43.14 64.16M46.57 52.12L50.24 55.51M55.06 43.96L58.3 47.76M74.6 30.9L76.87 35.35M85.39 26.18L87.12 30.87M96.66 22.76L97.82 27.62M108.25 20.69L108.83 25.66M131.75 20.69L131.17 25.66M143.34 22.76L142.18 27.62M154.61 26.18L152.88 30.87M165.4 30.9L163.13 35.35M184.94 43.96L181.7 47.76M193.43 52.12L189.76 55.51M200.9 61.22L196.86 64.16M207.25 71.14L202.89 73.58M216.25 92.86L211.43 94.21M218.77 104.36L213.83 105.14M219.92 116.07L214.93 116.27M219.69 127.85L214.71 127.45M215.11 150.9L210.35 149.36M210.81 161.87L206.27 159.77M205.26 172.25L201 169.64M198.53 181.91L194.61 178.81" fill="none" stroke="#1c1a16" stroke-width="0.9"/>

      <g font-family="'Jost', sans-serif" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#1c1a16">
        <text x="69.1" y="170.9">-15</text>
        <text x="49.4" y="134">-10</text>
        <text x="53.5" y="92.4">-5</text>
        <text x="80" y="60.1">0</text>
        <text x="120" y="48">5</text>
        <text x="160" y="60.1">10</text>
        <text x="186.5" y="92.4">15</text>
        <text x="190.6" y="134" fill="#a11d14">20</text>
        <text x="170.9" y="170.9" fill="#a11d14">25</text>
      </g>

      <text x="120" y="108" font-family="'Jost', sans-serif" font-size="12" font-weight="500" letter-spacing="4.5" text-anchor="middle" fill="#1c1a16">BOOST</text>
      <text x="120" y="158" font-family="'Jost', sans-serif" font-size="7.6" font-weight="500" letter-spacing="2.2" text-anchor="middle" fill="#1c1a16">LBS / SQ IN</text>

      <g transform="{{peakTransform}}" opacity="{{peakOpacity}}">
        <path d="M99 0L107 -3.6L107 3.6Z" fill="#1c1a16"/>
      </g>

      <g filter="url(#shadowB)">
        <g transform="{{needleTransform}}">
          <path d="M-27 -1.7L-15 -3.4L-6 -2.3L0 -1.9L88 -0.55L91 0L88 0.55L0 1.9L-6 2.3L-15 3.4L-27 1.7Z" fill="{{needle}}"/>
          <path d="M-27 -1.7L-15 -3.4L-6 -2.3L0 -1.9L88 -0.55L91 0L-27 0Z" fill="#ffffff" opacity="0.2"/>
        </g>
      </g>
      <circle cx="120" cy="120" r="8.4" fill="#1b1b1c"/>
      <circle cx="120" cy="120" r="7.2" fill="none" stroke="url(#chromeB1)" stroke-width="1.6"/>
      <circle cx="120" cy="120" r="2.6" fill="#050506"/>

      <path d="M28 84A98 98 0 0 1 130 21A132 132 0 0 0 28 84Z" fill="url(#glassB)"/>
    </svg>
    <img src="/_blob/24393da9f8d222ff3a71c88fc0dad598" alt="Cooper S" style="position: absolute; left: 35.42%; top: 29.64%; width: 29.17%; height: auto; display: block; pointer-events: none">
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 10px; flex-wrap: wrap">
      <button type="button" onClick="{{onDrive}}" aria-pressed="{{driveOn}}" style="min-height: 44px; padding: 0 18px; border-radius: 10px; background: transparent; color: #f2efe9; font-size: 14px; cursor: pointer; border: 1px solid {{driveBorder}}">Drive cycle</button>
      <button type="button" onClick="{{onReal}}" aria-pressed="{{realOn}}" style="min-height: 44px; padding: 0 18px; border-radius: 10px; background: transparent; color: #f2efe9; font-size: 14px; cursor: pointer; border: 1px solid {{realBorder}}">Real size</button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <label for="boostB" style="font-size: 14px; color: #a3aab2; white-space: nowrap">Hold boost</label>
      <input id="boostB" type="range" min="-15" max="25" step="0.5" value="{{sliderVal}}" onChange="{{onSlide}}" style="flex: 1 1 auto; min-width: 0; accent-color: #e8453a">
      <span style="min-width: 64px; text-align: right; font-size: 14px; font-variant-numeric: tabular-nums; color: #f2efe9">{{sliderLabel}}</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"needle":{"editor":"color","default":"#c8281e","options":["#c8281e","#e8620c","#1c1a16","#0b6e99"]},"$preview":{"width":520,"height":680}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.t0 = performance.now();
    this.setState({ mode: 'drive', held: 0, shown: -11, peak: 0, peakAt: 0, real: false });
    this.timer = setInterval(() => this.tick(), 33);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  profile(ms) {
    const k = [[0, -11], [3, -11], [5, 17], [8, 17.5], [10, -12], [14, -5], [17, 6], [20, -11]];
    const t = (ms % 20000) / 1000;
    for (let i = 1; i < k.length; i++) {
      if (t <= k[i][0]) {
        const f = (t - k[i - 1][0]) / (k[i][0] - k[i - 1][0]);
        return k[i - 1][1] + (k[i][1] - k[i - 1][1]) * f * f * (3 - 2 * f);
      }
    }
    return k[k.length - 1][1];
  }
  tick() {
    const s = this.state || {};
    const now = performance.now();
    const target = (s.mode ?? 'drive') === 'drive' ? this.profile(now - this.t0) : (s.held ?? 0);
    const from = s.shown ?? target;
    const shown = from + (target - from) * (1 - Math.exp(-33 / 80));
    let peak = s.peak ?? shown;
    let peakAt = s.peakAt ?? now;
    if (shown >= peak || now - peakAt > 5000) { peak = shown; peakAt = now; }
    this.setState({ shown, peak, peakAt });
  }
  renderVals() {
    const s = this.state || {};
    const shown = s.shown ?? -11;
    const peak = s.peak ?? 0;
    const mode = s.mode ?? 'drive';
    const real = !!s.real;
    const held = s.held ?? 0;
    const ang = (p) => 135 + (Math.min(25, Math.max(-15, p)) + 15) * 6.75;
    return {
      needleTransform: 'translate(120 120) rotate(' + ang(shown).toFixed(2) + ')',
      peakTransform: 'translate(120 120) rotate(' + ang(peak).toFixed(2) + ')',
      peakOpacity: peak > 0.05 ? 1 : 0,
      needle: this.props.needle ?? '#c8281e',
      gaugePx: real ? 123 : 380,
      sliderVal: mode === 'hold' ? held : Math.round(shown * 2) / 2,
      sliderLabel: (mode === 'hold' ? held : shown).toFixed(1) + ' psi',
      driveOn: mode === 'drive',
      realOn: real,
      driveBorder: mode === 'drive' ? '#e8453a' : '#39404a',
      realBorder: real ? '#e8453a' : '#39404a',
      onDrive: () => this.setState({ mode: 'drive' }),
      onSlide: (e) => this.setState({ mode: 'hold', held: parseFloat(e.target.value) }),
      onReal: () => this.setState({ real: !(this.state && this.state.real) })
    };
  }
}
</script>
</body>
</html>
