<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A · Modern Mini boost gauge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
body{margin:0}
button{font-family:'Barlow',system-ui,sans-serif}
</style>
</helmet>
<div style="width: 520px; height: 680px; box-sizing: border-box; padding: 28px 32px; background: #14171b; color: #f2efe9; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.01em">A · Modern Mini</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #a3aab2">Chrome ring, black dial, warm white numerals and an orange needle: the F56 interior, as a gauge.</p>
  </div>

  <div style="height: 400px; display: flex; align-items: center; justify-content: center">
    <div style="position: relative; width: {{gaugePx}}px; height: {{gaugePx}}px">
    <svg viewBox="0 0 240 240" role="img" aria-label="Boost gauge, modern Mini style" style="width: 100%; height: 100%; display: block">
      <defs>
        <linearGradient id="chromeA" x1="0.1" y1="0" x2="0.9" y2="1">
          <stop offset="0" stop-color="#fbfcfd"/>
          <stop offset="0.22" stop-color="#aab1ba"/>
          <stop offset="0.48" stop-color="#5a6068"/>
          <stop offset="0.72" stop-color="#cfd4da"/>
          <stop offset="1" stop-color="#7d838b"/>
        </linearGradient>
        <linearGradient id="chromeB" x1="0.9" y1="1" x2="0.1" y2="0">
          <stop offset="0" stop-color="#e9ecef"/>
          <stop offset="0.5" stop-color="#4b5058"/>
          <stop offset="1" stop-color="#bfc5cb"/>
        </linearGradient>
        <radialGradient id="dialA" cx="0.4" cy="0.32" r="0.85">
          <stop offset="0" stop-color="#262a30"/>
          <stop offset="0.6" stop-color="#121418"/>
          <stop offset="1" stop-color="#08090b"/>
        </radialGradient>
        <radialGradient id="vignetteA" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0.78" stop-color="#000" stop-opacity="0"/>
          <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
        </radialGradient>
        <linearGradient id="glassA" x1="0.2" y1="0" x2="0.6" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="0.2"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <filter id="shadowA" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="1.2" dy="2.4" stdDeviation="1.6" flood-color="#000" flood-opacity="0.65"/>
        </filter>
      </defs>

      <circle cx="120" cy="120" r="119.5" fill="#050506"/>
      <circle cx="120" cy="120" r="113.5" fill="none" stroke="url(#chromeA)" stroke-width="12"/>
      <circle cx="120" cy="120" r="107.5" fill="none" stroke="url(#chromeB)" stroke-width="1.6"/>
      <circle cx="120" cy="120" r="106.5" fill="url(#dialA)"/>
      <circle cx="120" cy="120" r="106.5" fill="url(#vignetteA)"/>

      <path d="M212.85 81.54A100.5 100.5 0 0 1 218.57 139.61" fill="none" stroke="#ffb000" stroke-width="3.6"/>
      <path d="M218.57 139.61A100.5 100.5 0 0 1 191.06 191.06" fill="none" stroke="#ff3b30" stroke-width="3.6"/>

      <path d="M24.86 138.92L38.59 136.19M30.38 82.88L43.32 88.24M66.11 39.35L73.89 50.99M120 23L120 37M173.89 39.35L166.11 50.99M209.62 82.88L196.68 88.24M215.14 138.92L201.41 136.19M51.41 188.59L61.31 178.69M188.59 188.59L178.69 178.69" fill="none" stroke="#f4f1ea" stroke-width="2.2"/>
      <path d="M34.45 165.73L39.75 162.9M23.47 110.49L29.44 111.08M45.02 58.46L49.66 62.27M91.84 27.18L93.58 32.92M148.16 27.18L146.42 32.92M194.98 58.46L190.34 62.27M216.53 110.49L210.56 111.08M205.55 165.73L200.25 162.9" fill="none" stroke="#9aa0a7" stroke-width="1"/>

      <g font-family="'Barlow', sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central">
        <text x="71.2" y="168.8" fill="#9ec3ff">-15</text>
        <text x="52.3" y="133.5" fill="#9ec3ff">-10</text>
        <text x="56.3" y="93.6" fill="#9ec3ff">-5</text>
        <text x="81.7" y="62.6" fill="#f4f1ea">0</text>
        <text x="120" y="51" fill="#f4f1ea">5</text>
        <text x="158.3" y="62.6" fill="#f4f1ea">10</text>
        <text x="183.7" y="93.6" fill="#f4f1ea">15</text>
        <text x="187.7" y="133.5" fill="#ffb000">20</text>
        <text x="168.8" y="168.8" fill="#ff5a4d">25</text>
      </g>

      <text x="120" y="111" font-family="'Barlow Condensed', sans-serif" font-size="11" font-weight="600" letter-spacing="3.2" text-anchor="middle" fill="#9aa0a7">BOOST</text>

      <rect x="88" y="148" width="64" height="30" rx="7" fill="#07080a" stroke="#2c3138" stroke-width="1"/>
      <text x="120" y="164" font-family="'Barlow', sans-serif" font-size="21" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#ffffff">{{readout}}</text>
      <text x="120" y="190" font-family="'Barlow Condensed', sans-serif" font-size="9.5" font-weight="600" letter-spacing="2.4" text-anchor="middle" fill="#9aa0a7">PSI</text>

      <g transform="{{peakTransform}}" opacity="{{peakOpacity}}">
        <path d="M100 0L108 -3.8L108 3.8Z" fill="#f4f1ea"/>
      </g>

      <g filter="url(#shadowA)">
        <g transform="{{needleTransform}}">
          <path d="M-18 -2.6L0 -3.4L86 -0.7L86 0.7L0 3.4L-18 2.6Z" fill="{{needle}}"/>
          <path d="M-18 -2.6L0 -3.4L86 -0.7L86 0L-18 0Z" fill="#ffffff" opacity="0.22"/>
        </g>
      </g>
      <circle cx="120" cy="120" r="9" fill="url(#chromeA)" stroke="#0a0a0b" stroke-width="1"/>
      <circle cx="120" cy="120" r="3.4" fill="#15171a"/>

      <path d="M28 84A98 98 0 0 1 130 21A132 132 0 0 0 28 84Z" fill="url(#glassA)"/>
    </svg>
    <img src="/_blob/a3bf5e3c0e2ef1b85a51c1db5437641e" alt="Cooper S" style="position: absolute; left: 34.58%; top: 32.76%; width: 30.83%; height: auto; display: block; pointer-events: none">
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 10px; flex-wrap: wrap">
      <button type="button" onClick="{{onDrive}}" aria-pressed="{{driveOn}}" style="min-height: 44px; padding: 0 18px; border-radius: 10px; background: transparent; color: #f2efe9; font-size: 14px; cursor: pointer; border: 1px solid {{driveBorder}}">Drive cycle</button>
      <button type="button" onClick="{{onReal}}" aria-pressed="{{realOn}}" style="min-height: 44px; padding: 0 18px; border-radius: 10px; background: transparent; color: #f2efe9; font-size: 14px; cursor: pointer; border: 1px solid {{realBorder}}">Real size</button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <label for="boostA" style="font-size: 14px; color: #a3aab2; white-space: nowrap">Hold boost</label>
      <input id="boostA" type="range" min="-15" max="25" step="0.5" value="{{sliderVal}}" onChange="{{onSlide}}" style="flex: 1 1 auto; min-width: 0; accent-color: #ff5a1f">
      <span style="min-width: 64px; text-align: right; font-size: 14px; font-variant-numeric: tabular-nums; color: #f2efe9">{{sliderLabel}}</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"needle":{"editor":"color","default":"#ff5a1f","options":["#ff5a1f","#ff2d55","#ffffff","#39d0c8"]},"$preview":{"width":520,"height":680}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.t0 = performance.now();
    this.setState({ mode: 'drive', held: 0, shown: -11, peak: 0, peakAt: 0, real: false });
    this.timer = setInterval(() => this.tick(), 33);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  profile(ms) {
    const k = [[0, -11], [3, -11], [5, 17], [8, 17.5], [10, -12], [14, -5], [17, 6], [20, -11]];
    const t = (ms % 20000) / 1000;
    for (let i = 1; i < k.length; i++) {
      if (t <= k[i][0]) {
        const f = (t - k[i - 1][0]) / (k[i][0] - k[i - 1][0]);
        return k[i - 1][1] + (k[i][1] - k[i - 1][1]) * f * f * (3 - 2 * f);
      }
    }
    return k[k.length - 1][1];
  }
  tick() {
    const s = this.state || {};
    const now = performance.now();
    const target = (s.mode ?? 'drive') === 'drive' ? this.profile(now - this.t0) : (s.held ?? 0);
    const from = s.shown ?? target;
    const shown = from + (target - from) * (1 - Math.exp(-33 / 80));
    let peak = s.peak ?? shown;
    let peakAt = s.peakAt ?? now;
    if (shown >= peak || now - peakAt > 5000) { peak = shown; peakAt = now; }
    this.setState({ shown, peak, peakAt });
  }
  renderVals() {
    const s = this.state || {};
    const shown = s.shown ?? -11;
    const peak = s.peak ?? 0;
    const mode = s.mode ?? 'drive';
    const real = !!s.real;
    const held = s.held ?? 0;
    const ang = (p) => 135 + (Math.min(25, Math.max(-15, p)) + 15) * 6.75;
    return {
      needleTransform: 'translate(120 120) rotate(' + ang(shown).toFixed(2) + ')',
      peakTransform: 'translate(120 120) rotate(' + ang(peak).toFixed(2) + ')',
      peakOpacity: peak > 0.05 ? 1 : 0,
      readout: shown.toFixed(1),
      needle: this.props.needle ?? '#ff5a1f',
      gaugePx: real ? 123 : 380,
      sliderVal: mode === 'hold' ? held : Math.round(shown * 2) / 2,
      sliderLabel: (mode === 'hold' ? held : shown).toFixed(1) + ' psi',
      driveOn: mode === 'drive',
      realOn: real,
      driveBorder: mode === 'drive' ? '#ff5a1f' : '#39404a',
      realBorder: real ? '#ff5a1f' : '#39404a',
      onDrive: () => this.setState({ mode: 'drive' }),
      onSlide: (e) => this.setState({ mode: 'hold', held: parseFloat(e.target.value) }),
      onReal: () => this.setState({ real: !(this.state && this.state.real) })
    };
  }
}
</script>
</body>
</html>
