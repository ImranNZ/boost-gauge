<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D · Motorsport boost gauge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
body{margin:0}
button{font-family:'Barlow',system-ui,sans-serif}
</style>
</helmet>
<div style="width: 520px; height: 680px; box-sizing: border-box; padding: 28px 32px; background: #14171b; color: #f2efe9; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.01em">D · Motorsport</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #a3aab2">A segmented bar that lights up through blue, green, amber and red, a bold slanted readout, and a rim that pulses red past 20 psi like a shift light.</p>
  </div>

  <div style="height: 400px; display: flex; align-items: center; justify-content: center">
    <div style="position: relative; width: {{gaugePx}}px; height: {{gaugePx}}px">
    <svg viewBox="0 0 240 240" role="img" aria-label="Boost gauge, motorsport segmented bar" style="width: 100%; height: 100%; display: block">
      <defs>
        <radialGradient id="bgD" cx="0.5" cy="0.4" r="0.7">
          <stop offset="0" stop-color="#14171c"/>
          <stop offset="1" stop-color="#06070a"/>
        </radialGradient>
        <pattern id="carbonD" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="2" height="4" fill="#ffffff" opacity="0.04"/>
        </pattern>
        <filter id="glowD" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="3.2"/>
        </filter>
      </defs>

      <circle cx="120" cy="120" r="120" fill="url(#bgD)"/>
      <circle cx="120" cy="120" r="120" fill="url(#carbonD)"/>

      <circle cx="120" cy="120" r="116.4" fill="none" stroke="{{ringColor}}" stroke-width="5" opacity="{{ringGlow}}" filter="url(#glowD)"/>
      <circle cx="120" cy="120" r="116.4" fill="none" stroke="{{ringColor}}" stroke-width="2.6" opacity="{{ringOpacity}}"/>

      <path d="{{segDim}}" fill="#1b2026"/>
      <g id="litD">
        <path d="{{segBlue}}" fill="#3b8bff"/>
        <path d="{{segCyan}}" fill="#19d3a2"/>
        <path d="{{segLime}}" fill="#9be04a"/>
        <path d="{{segAmber}}" fill="#ffb020"/>
        <path d="{{segRed}}" fill="#ff3b30"/>
      </g>
      <use href="#litD" filter="url(#glowD)" opacity="0.5"/>
      <path d="{{segPeak}}" fill="none" stroke="#ffffff" stroke-width="1.6" opacity="{{peakOpacity}}"/>

      <g font-family="'Saira Condensed', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#8b93a0">
        <text x="65.6" y="174.4">-15</text>
        <text x="44.5" y="135">-10</text>
        <text x="48.9" y="90.5">-5</text>
        <text x="77.2" y="56">0</text>
        <text x="120" y="43">5</text>
        <text x="162.8" y="56">10</text>
        <text x="191.1" y="90.5">15</text>
        <text x="195.5" y="135">20</text>
        <text x="174.4" y="174.4">25</text>
      </g>

      <text x="120" y="82" font-family="'Saira Condensed', sans-serif" font-size="12" font-weight="600" letter-spacing="5" text-anchor="middle" fill="#8b93a0">BOOST</text>
      <g transform="translate(120 118) skewX(-8)">
        <text x="0" y="0" font-family="'Saira Condensed', sans-serif" font-size="70" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="{{numberColor}}">{{readout}}</text>
      </g>
      <text x="120" y="154" font-family="'Saira Condensed', sans-serif" font-size="13" font-weight="600" letter-spacing="5" text-anchor="middle" fill="#8b93a0">PSI</text>
      <text x="120" y="174" font-family="'Saira Condensed', sans-serif" font-size="14" font-weight="600" letter-spacing="2.4" text-anchor="middle" fill="#ffb020">{{peakText}}</text>
    </svg>
    <img src="/_blob/a3bf5e3c0e2ef1b85a51c1db5437641e" alt="Cooper S" style="position: absolute; left: 36.67%; top: 22.9%; width: 26.67%; height: auto; display: block; pointer-events: none">
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 10px; flex-wrap: wrap">
      <button type="button" onClick="{{onDrive}}" aria-pressed="{{driveOn}}" style="min-height: 44px; padding: 0 18px; border-radius: 10px; background: transparent; color: #f2efe9; font-size: 14px; cursor: pointer; border: 1px solid {{driveBorder}}">Drive cycle</button>
      <button type="button" onClick="{{onReal}}" aria-pressed="{{realOn}}" style="min-height: 44px; padding: 0 18px; border-radius: 10px; background: transparent; color: #f2efe9; font-size: 14px; cursor: pointer; border: 1px solid {{realBorder}}">Real size</button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <label for="boostD" style="font-size: 14px; color: #a3aab2; white-space: nowrap">Hold boost</label>
      <input id="boostD" type="range" min="-15" max="25" step="0.5" value="{{sliderVal}}" onChange="{{onSlide}}" style="flex: 1 1 auto; min-width: 0; accent-color: #ffb020">
      <span style="min-width: 64px; text-align: right; font-size: 14px; font-variant-numeric: tabular-nums; color: #f2efe9">{{sliderLabel}}</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":680}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.t0 = performance.now();
    this.setState({ mode: 'drive', held: 0, shown: -11, peak: 0, peakAt: 0, real: false });
    this.timer = setInterval(() => this.tick(), 33);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  profile(ms) {
    const k = [[0, -11], [3, -11], [5, 17], [8, 17.5], [10, -12], [14, -5], [17, 6], [20, -11]];
    const t = (ms % 20000) / 1000;
    for (let i = 1; i < k.length; i++) {
      if (t <= k[i][0]) {
        const f = (t - k[i - 1][0]) / (k[i][0] - k[i - 1][0]);
        return k[i - 1][1] + (k[i][1] - k[i - 1][1]) * f * f * (3 - 2 * f);
      }
    }
    return k[k.length - 1][1];
  }
  tick() {
    const s = this.state || {};
    const now = performance.now();
    const target = (s.mode ?? 'drive') === 'drive' ? this.profile(now - this.t0) : (s.held ?? 0);
    const from = s.shown ?? target;
    const shown = from + (target - from) * (1 - Math.exp(-33 / 80));
    let peak = s.peak ?? shown;
    let peakAt = s.peakAt ?? now;
    if (shown >= peak || now - peakAt > 5000) { peak = shown; peakAt = now; }
    this.setState({ shown, peak, peakAt });
  }
  segments() {
    if (this._segs) return this._segs;
    const R1 = 90;
    const R2 = 108;
    const P = (r, a) => (120 + r * Math.cos(a)).toFixed(2) + ' ' + (120 + r * Math.sin(a)).toFixed(2);
    this._segs = [];
    for (let i = 0; i < 40; i++) {
      const a0 = (135 + i * 6.75 + 0.55) * Math.PI / 180;
      const a1 = (135 + (i + 1) * 6.75 - 0.55) * Math.PI / 180;
      this._segs.push('M' + P(R2, a0) + 'A' + R2 + ' ' + R2 + ' 0 0 1 ' + P(R2, a1) + 'L' + P(R1, a1) + 'A' + R1 + ' ' + R1 + ' 0 0 0 ' + P(R1, a0) + 'Z');
    }
    return this._segs;
  }
  zoneOf(mid) {
    if (mid < 0) return 0;
    if (mid < 10) return 1;
    if (mid < 15) return 2;
    if (mid < 20) return 3;
    return 4;
  }
  renderVals() {
    const s = this.state || {};
    const shown = s.shown ?? -11;
    const peak = s.peak ?? 0;
    const mode = s.mode ?? 'drive';
    const real = !!s.real;
    const held = s.held ?? 0;
    const segs = this.segments();
    const dim = [];
    const lit = [[], [], [], [], []];
    for (let i = 0; i < 40; i++) {
      if (shown >= -15 + i + 0.5) lit[this.zoneOf(-14.5 + i)].push(segs[i]);
      else dim.push(segs[i]);
    }
    const peakIndex = Math.max(0, Math.min(39, Math.floor(peak + 15)));
    const hot = shown > 20;
    const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 90);
    return {
      segDim: dim.join(''),
      segBlue: lit[0].join(''),
      segCyan: lit[1].join(''),
      segLime: lit[2].join(''),
      segAmber: lit[3].join(''),
      segRed: lit[4].join(''),
      segPeak: segs[peakIndex],
      peakOpacity: peak > 0.05 ? 1 : 0,
      peakText: peak > 0.05 ? 'PEAK ' + peak.toFixed(1) : '',
      readout: shown.toFixed(1),
      numberColor: hot ? '#ff5a4d' : '#ffffff',
      ringColor: hot ? '#ff3b30' : '#2a2f36',
      ringOpacity: hot ? pulse : 1,
      ringGlow: hot ? pulse * 0.7 : 0,
      gaugePx: real ? 123 : 380,
      sliderVal: mode === 'hold' ? held : Math.round(shown * 2) / 2,
      sliderLabel: (mode === 'hold' ? held : shown).toFixed(1) + ' psi',
      driveOn: mode === 'drive',
      realOn: real,
      driveBorder: mode === 'drive' ? '#ffb020' : '#39404a',
      realBorder: real ? '#ffb020' : '#39404a',
      onDrive: () => this.setState({ mode: 'drive' }),
      onSlide: (e) => this.setState({ mode: 'hold', held: parseFloat(e.target.value) }),
      onReal: () => this.setState({ real: !(this.state && this.state.real) })
    };
  }
}
</script>
</body>
</html>
