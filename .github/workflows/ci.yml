name: CI

# Pull requests prove the change (tests, coverage gate, all four firmware builds).
# A merge to main builds the firmware again and keeps the images as downloadable
# artifacts, so there is always a flashable build of what is on main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests, coverage gate, layering (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio gcovr
      # Checks the layering, runs the unit tests, and fails below 100% line/branch coverage.
      - run: tools/coverage.sh

  test-macos:
    name: Unit tests (macOS, Apple clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      # PlatformIO labels doctest runs SKIPPED, so read doctest's own verdict.
      - name: Run unit tests
        run: |
          pio test -e native -vv | tee test.log
          grep -q "Status: SUCCESS" test.log

  sim:
    name: Simulator build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e sim

  firmware:
    name: Firmware (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [device-demo, device-can, device-ble, device-wifi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e ${{ matrix.env }}
      # Only what is on main is worth keeping; pull requests just prove it builds.
      - name: Keep the firmware images
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}-${{ github.sha }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/bootloader.bin
            .pio/build/${{ matrix.env }}/partitions.bin
          retention-days: 30
