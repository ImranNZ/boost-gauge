name: CI

# One pipeline, three stages, each gated on the one before:
#
#   1. test      unit tests + coverage gate + layering (Linux), unit tests (macOS), sim build,
#                render regression (every look against its stored images),
#                format (clang-format) and static analysis (cppcheck)
#   2. build     the four ESP32 firmware environments
#   3. publish   (push only) bundle the firmware images
#                  - merge to main:  kept as a build artifact for 30 days
#                  - tag v*:         attached to a GitHub Release
#
# Pull requests run stages 1 and 2 to prove the change; nothing is published.
# Third-party actions are pinned to commit SHAs and the Python tools to exact versions
# (requirements.txt); Dependabot proposes updates as pull requests, so CI only changes
# when we choose.
# To cut a release:  git tag v0.1.0 && git push origin v0.1.0
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ 1. test --
  test:
    name: Tests, coverage gate, layering (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install -r requirements.txt
      # Checks the layering, runs the unit tests, and fails below 100% line/branch coverage.
      - run: tools/coverage.sh

  test-macos:
    name: Unit tests (macOS, Apple clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install -r requirements.txt
      # PlatformIO labels doctest runs SKIPPED, so read doctest's own verdict.
      - name: Run unit tests
        run: |
          pio test -e native -vv | tee test.log
          grep -q "Status: SUCCESS" test.log

  sim:
    name: Simulator build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install -r requirements.txt
      - run: pio run -e sim

  renders:
    name: Render regression (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install -r requirements.txt
      # Renders every look at fixed moments and compares with test/golden/.
      - run: python tools/check_renders.py
      # On a failure, keep what was drawn, what was expected, and where they differ.
      - name: Keep the differences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-diff
          path: out/render-diff
          retention-days: 7

  format:
    name: Format (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # Fails and lists the files if any differ from .clang-format. Fix: python tools/format.py
      - run: python tools/format.py --check

  static-analysis:
    name: Static analysis (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - run: cppcheck --version
      - run: tools/static_analysis.sh

  # ----------------------------------------------------------------- 2. build --
  firmware:
    name: Firmware (${{ matrix.env }})
    needs: [test, test-macos, sim, renders, format, static-analysis]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [device-demo, device-can, device-ble, device-wifi]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install -r requirements.txt
      - run: pio run -e ${{ matrix.env }}
      # boot_app0.bin ships with the Arduino framework; flashing needs it next to the others.
      - name: Collect the images
        run: |
          out=.pio/build/${{ matrix.env }}
          cp "$(find ~/.platformio -name boot_app0.bin | head -n 1)" "$out/boot_app0.bin"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/bootloader.bin
            .pio/build/${{ matrix.env }}/partitions.bin
            .pio/build/${{ matrix.env }}/boot_app0.bin
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  # --------------------------------------------------------------- 3. publish --
  publish:
    name: Publish firmware
    needs: firmware
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the GitHub Release on a tag
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: firmware-*
          path: dist

      - name: Bundle the images
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then label="$GITHUB_REF_NAME"; else label="main-${GITHUB_SHA::7}"; fi
          echo "LABEL=$label" >> "$GITHUB_ENV"
          mkdir out
          for dir in dist/firmware-*; do
            env_name="${dir#dist/firmware-}"
            for f in firmware bootloader partitions boot_app0; do
              cp "$dir/$f.bin" "out/${env_name}-${f}.bin"
            done
          done
          (cd out && sha256sum *.bin > SHA256SUMS)
          ls -l out

      # Every merge to main: a downloadable "latest main" build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-${{ env.LABEL }}
          path: out/*
          retention-days: 30

      # A version tag: a GitHub Release with the images attached. The script creates it as a
      # draft, uploads each file with retries, checks they all arrived, then publishes, so a
      # flaky API call cannot leave a half-built public release. A v0.* tag is a pre-release.
      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: tools/publish_release.sh "$GITHUB_REF_NAME" out
