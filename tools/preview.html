<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boost Gauge Preview</title>
<style>
  :root {
    --bg: #101214;
    --panel: #181b1f;
    --line: #2a2e33;
    --text: #d8dde2;
    --muted: #8b939c;
    --accent: #ff4a1c;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #eef0f2; --panel: #ffffff; --line: #d2d6da; --text: #1d2125; --muted: #5d6670; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; place-items: center;
  }
  main { width: 100%; max-width: 560px; padding: 24px 16px; display: grid; gap: 22px; justify-items: center; }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; }
  #screen {
    width: min(86vw, 420px); height: auto; aspect-ratio: 1; border-radius: 50%; background: #000;
    box-shadow: 0 0 0 10px #23272c, 0 0 0 12px var(--line), 0 18px 50px rgba(0,0,0,.45);
  }
  #screen.crisp { image-rendering: pixelated; }
  #screen.real { width: 32.5mm; box-shadow: 0 0 0 2mm #23272c, 0 0 0 2.3mm var(--line); }
  #screen.native { width: 240px; }
  select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .check { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  .hint { color: var(--muted); font-size: 13px; flex: 1 1 200px; }
  .controls { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button {
    font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 14px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { border-color: var(--accent); }
  label { color: var(--muted); }
  input[type=range] { flex: 1 1 180px; accent-color: var(--accent); }
  output { min-width: 5.5em; text-align: right; font-variant-numeric: tabular-nums; }
  #status { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>Boost gauge &middot; mock ECU</h1>
  <img id="screen" alt="Live gauge display" width="240" height="240">

  <section class="controls" aria-label="Mock ECU controls">
    <div class="row">
      <button class="primary" id="drive">Drive cycle</button>
      <button id="offline">Drop link</button>
      <button id="online">Restore link</button>
    </div>
    <div class="row">
      <label for="size">View</label>
      <select id="size">
        <option value="fit">Fit to page</option>
        <option value="native">1:1 (240 px)</option>
        <option value="real">Real size (32.5 mm display)</option>
      </select>
      <label class="check"><input type="checkbox" id="crisp"> Show raw pixels</label>
    </div>
    <div class="row">
      <label for="rate">Data rate</label>
      <select id="rate">
        <option value="30">30 Hz (every frame)</option>
        <option value="25" selected>25 Hz (CAN)</option>
        <option value="10">10 Hz (ELM327 dongle)</option>
        <option value="5">5 Hz (slow dongle)</option>
        <option value="2">2 Hz (struggling)</option>
      </select>
      <span class="hint">The needle eases between readings, so it stays smooth at any rate.</span>
    </div>
    <div class="row">
      <label for="boost">Hold boost</label>
      <input id="boost" type="range" min="-15" max="25" step="0.5" value="0">
      <output id="boostOut" for="boost">0.0 psi</output>
    </div>
  </section>

  <div id="status">connecting&hellip;</div>
</main>

<script>
  const img = document.getElementById('screen');
  const status = document.getElementById('status');
  const slider = document.getElementById('boost');
  const sliderOut = document.getElementById('boostOut');

  const send = (command) => fetch('/cmd', { method: 'POST', body: command }).catch(() => {});

  document.getElementById('drive').onclick = () => send('drive');
  document.getElementById('offline').onclick = () => send('offline');
  document.getElementById('online').onclick = () => send('online');
  document.getElementById('rate').onchange = (event) => send('rate ' + event.target.value);
  slider.oninput = () => {
    sliderOut.textContent = Number(slider.value).toFixed(1) + ' psi';
    send('boost ' + slider.value);
  };

  // View options: remembered across reloads, but the page works without storage.
  const sizeSelect = document.getElementById('size');
  const crispBox = document.getElementById('crisp');
  const saved = (key, fallback) => { try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; } };
  const save = (key, value) => { try { localStorage.setItem(key, value); } catch {} };

  function applyView() {
    img.classList.remove('native', 'real');
    if (sizeSelect.value !== 'fit') img.classList.add(sizeSelect.value);
    img.classList.toggle('crisp', crispBox.checked);
    save('preview.size', sizeSelect.value);
    save('preview.crisp', crispBox.checked ? '1' : '0');
  }
  sizeSelect.value = saved('preview.size', 'fit');
  crispBox.checked = saved('preview.crisp', '0') === '1';
  sizeSelect.onchange = crispBox.onchange = applyView;
  applyView();

  let seq = 0, frames = 0, last = performance.now();

  async function pump() {
    for (;;) {
      try {
        const response = await fetch('/frame?after=' + seq, { cache: 'no-store' });
        if (response.status === 204) continue;
        if (!response.ok) throw new Error(response.status);
        seq = Number(response.headers.get('X-Seq'));
        const url = URL.createObjectURL(await response.blob());
        const previous = img.src;
        img.src = url;
        if (previous.startsWith('blob:')) URL.revokeObjectURL(previous);
        frames++;
      } catch (error) {
        status.textContent = 'preview server not reachable';
        await new Promise((resolve) => setTimeout(resolve, 700));
      }
    }
  }

  setInterval(() => {
    const now = performance.now();
    if (frames) status.textContent = (frames * 1000 / (now - last)).toFixed(0) + ' fps';
    frames = 0; last = now;
  }, 1000);

  pump();
</script>
</body>
</html>
