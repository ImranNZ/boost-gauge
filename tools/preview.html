<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boost Gauge Preview</title>
<style>
  :root {
    --bg: #101214;
    --panel: #181b1f;
    --line: #2a2e33;
    --text: #d8dde2;
    --muted: #8b939c;
    --accent: #ff4a1c;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #eef0f2; --panel: #ffffff; --line: #d2d6da; --text: #1d2125; --muted: #5d6670; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; place-items: center;
  }
  main { width: 100%; max-width: 560px; padding: 24px 16px; display: grid; gap: 22px; justify-items: center; }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; }
  #screen {
    width: min(86vw, 420px); height: auto; aspect-ratio: 1; border-radius: 50%; background: #000;
    box-shadow: 0 0 0 10px #23272c, 0 0 0 12px var(--line), 0 18px 50px rgba(0,0,0,.45);
    image-rendering: pixelated;
  }
  .controls { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button {
    font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 14px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { border-color: var(--accent); }
  label { color: var(--muted); }
  input[type=range] { flex: 1 1 180px; accent-color: var(--accent); }
  output { min-width: 5.5em; text-align: right; font-variant-numeric: tabular-nums; }
  #status { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>Boost gauge &middot; mock ECU</h1>
  <img id="screen" alt="Live gauge display" width="240" height="240">

  <section class="controls" aria-label="Mock ECU controls">
    <div class="row">
      <button class="primary" id="drive">Drive cycle</button>
      <button id="offline">Drop link</button>
      <button id="online">Restore link</button>
    </div>
    <div class="row">
      <label for="boost">Hold boost</label>
      <input id="boost" type="range" min="-15" max="25" step="0.5" value="0">
      <output id="boostOut" for="boost">0.0 psi</output>
    </div>
  </section>

  <div id="status">connecting&hellip;</div>
</main>

<script>
  const img = document.getElementById('screen');
  const status = document.getElementById('status');
  const slider = document.getElementById('boost');
  const sliderOut = document.getElementById('boostOut');

  const send = (command) => fetch('/cmd', { method: 'POST', body: command }).catch(() => {});

  document.getElementById('drive').onclick = () => send('drive');
  document.getElementById('offline').onclick = () => send('offline');
  document.getElementById('online').onclick = () => send('online');
  slider.oninput = () => {
    sliderOut.textContent = Number(slider.value).toFixed(1) + ' psi';
    send('boost ' + slider.value);
  };

  let seq = 0, frames = 0, last = performance.now();

  async function pump() {
    for (;;) {
      try {
        const response = await fetch('/frame?after=' + seq, { cache: 'no-store' });
        if (response.status === 204) continue;
        if (!response.ok) throw new Error(response.status);
        seq = Number(response.headers.get('X-Seq'));
        const url = URL.createObjectURL(await response.blob());
        const previous = img.src;
        img.src = url;
        if (previous.startsWith('blob:')) URL.revokeObjectURL(previous);
        frames++;
      } catch (error) {
        status.textContent = 'preview server not reachable';
        await new Promise((resolve) => setTimeout(resolve, 700));
      }
    }
  }

  setInterval(() => {
    const now = performance.now();
    if (frames) status.textContent = (frames * 1000 / (now - last)).toFixed(0) + ' fps';
    frames = 0; last = now;
  }, 1000);

  pump();
</script>
</body>
</html>
