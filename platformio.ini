; Boost gauge for F56 Mini Cooper S (B48) on Waveshare ESP32-S3-LCD-1.28-B
;
; Environments:
;   device-can   ESP32-S3 + SN65HVD230 transceiver wired to OBD pins 6/14 (TWAI)
;   device-ble   ESP32-S3 + Bluetooth LE ELM327 dongle
;   device-wifi  ESP32-S3 + WiFi ELM327 dongle
;   device-demo  ESP32-S3 with the simulated ECU (bench demo, no car needed)
;   native       PC build: unit tests   (pio test -e native)
;   sim          PC build: renders gauge frames to out/*.png   (pio run -e sim -t exec)

[platformio]
default_envs = native

[env]
build_unflags = -std=gnu++11 -std=gnu++14
build_flags = -std=gnu++17 -Wall -Wextra

; ---------------------------------------------------------------- device ---
[device]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
lib_ldf_mode = chain+
build_src_filter = -<*> +<main.cpp> +<device/LgfxCanvas.cpp> +<device/SamplerTask.cpp>
lib_deps =
    lovyan03/LovyanGFX@1.1.16
; The board (screen, pins): a folder under src/boards/, see src/boards/Board.h.
build_flags =
    ${env.build_flags}
    -DBOARD_WAVESHARE_LCD_128B
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:device-can]
extends = device
build_src_filter = ${device.build_src_filter} +<device/TwaiBus.cpp>
build_flags = ${device.build_flags} -DTRANSPORT_CAN

[env:device-ble]
extends = device
build_src_filter = ${device.build_src_filter} +<device/BleElmStream.cpp>
lib_deps =
    ${device.lib_deps}
    h2zero/NimBLE-Arduino@1.4.2
build_flags = ${device.build_flags} -DTRANSPORT_BLE

[env:device-wifi]
extends = device
build_src_filter = ${device.build_src_filter} +<device/WifiElmStream.cpp>
build_flags = ${device.build_flags} -DTRANSPORT_WIFI

[env:device-demo]
extends = device
build_flags = ${device.build_flags} -DTRANSPORT_DEMO

; ---------------------------------------------------------------- native ---
[env:native]
platform = native
test_framework = doctest
lib_compat_mode = off

; Same tests, instrumented for gcov.  See tools/coverage.sh
[env:coverage]
platform = native
test_framework = doctest
lib_compat_mode = off
build_flags = ${env.build_flags} --coverage -O0 -fno-inline
build_unflags = -std=gnu++11 -std=gnu++14
extra_scripts = post:tools/link_coverage.py

[env:sim]
platform = native
build_flags = ${env.build_flags} -pthread
build_src_filter = -<*> +<sim/>
lib_compat_mode = off

; The sim for the README media (tools/make_media.py): same code, but never with the
; Cooper S badge, which is brand artwork that must not be published.
[env:sim-media]
extends = env:sim
build_flags = ${env:sim.build_flags} -DBOOST_GAUGE_NO_BADGE
